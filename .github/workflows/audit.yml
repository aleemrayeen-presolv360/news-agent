# Audit: weekly source health report.
#
# CRON IS UTC. IST = UTC+5:30.
# '0 3 * * 1' = Monday 03:00 UTC = Monday 08:30 IST
#
# Budget: 4 runs/month x ~2 min = ~8 of 2,000 free minutes.

name: audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send audit report
        run: python -m agent.audit
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}

      - name: Notify on failure
        if: failure()
        run: python -m agent.notify_failure
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
