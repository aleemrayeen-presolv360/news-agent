# Daily: score yesterday's news and refresh the website data (frontend/data.js).
#
# CRON IS UTC. IST = UTC+5:30.
# '31 1 * * *' = 01:31 UTC = 07:01 IST, every day, so the site is fresh each morning.
#
# Why daily: Groq's free tier allows ~11 scoring calls a minute (8,000 tokens/min),
# so one weekly run can't keep up with ~60 new articles a day.
#
# GitHub delays or drops scheduled runs when it is busy (seen: 5h late, and
# 4-hourly ingests running only 3-4 times a day). So the job starts with its own
# ingest, and a 09:01 IST catch-up run does the work only if 07:01 never happened.
#
# Budget: a private repo gets 2,000 Actions min/month (public: unlimited). Measured 19-26 Oct 2026:
# this job 28-42 min with --limit 250, ingest ~1 min x 6 a day. At --limit 200 the month is
# ~1,150 min (this job ~30 x 32, ingest ~180, new-source a few). The timeout caps a stuck run.
# Waiting on Groq's rate limit is billed, so --limit on the score step is the main dial.

name: daily

# GitHub starts scheduled runs late, sometimes by hours, so cron-job.org starts this job at
# 07:01 IST (backup 09:01) through the API, with timer=true. The schedules below stay as a
# last resort. A timer or scheduled run exits in seconds once a run has finished today;
# a run started by hand in Actions always runs in full.
on:
  schedule:
    - cron: '31 1 * * *'   # 07:01 IST
    - cron: '31 3 * * *'   # 09:01 IST catch-up
  workflow_dispatch:
    inputs:
      timer:
        description: 'Started by the morning timer: skip if today has already run'
        type: boolean
        default: false

# Same group as new-source.yml: the two never run at once or race to push data.js
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read    # to see whether today's run already happened

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # scoring runs ~6-8 stories a minute, so 200 takes ~25-33 min
    steps:
      - uses: actions/checkout@v4

      # Timer and scheduled runs: stop if a daily run already finished today (IST)
      - name: Already ran today?
        id: fresh
        if: github.event_name == 'schedule' || github.event.inputs.timer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(TZ=Asia/Kolkata date +%FT00:00:00+05:30)
          done=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --status success --created ">=$since" --json databaseId --jq length)
          if [ "$done" -gt 0 ]; then
            echo "the daily job already ran today, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/cache@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - run: pip install -r requirements.txt
        if: steps.fresh.outputs.skip != 'true'

      # One Groq call; never fails the job (agent/trends.py swallows its own errors)
      - name: Find trends to watch
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.trends
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Ingest feeds
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.ingest
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}   # optional: Indian news from NewsData.io

      - name: Triage items
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.triage
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Extract articles
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.extract --limit 300
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Generate embeddings
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.embed --limit 1000
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Score items
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.score --limit 200
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # optional backup

      - name: Cluster stories
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.cluster
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Detect threads
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.threads
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Generate static frontend data
        if: steps.fresh.outputs.skip != 'true'
        run: python -m agent.publish_static
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}   # so the source list matches what's fetched

      - name: Commit and push data.js
        if: steps.fresh.outputs.skip != 'true'
        run: |
          bash scripts/push_site_data.sh "chore: daily website data [skip ci]"
