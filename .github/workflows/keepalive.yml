# DO NOT DELETE THIS WORKFLOW.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity. The docs word this as applying to public repos, but it has been
# reported on private ones too. If it fires, your agent stops silently and
# you find out weeks later.
#
# One commit a month removes the risk entirely. A GITHUB_TOKEN push does not
# re-trigger workflows, so this cannot loop.

name: keepalive

on:
  schedule:
    - cron: '0 4 1 * *'       # 1st of the month, 04:00 UTC = 09:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
