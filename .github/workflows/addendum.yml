# Addendum: publish Friday afternoon late-breaking news.
#
# CRON IS UTC. IST = UTC+5:30.
# '30 2 * * 6' = Saturday 02:30 UTC = Saturday 08:00 IST
#
# Budget: 4 runs/month x ~5 min = ~20 of 2,000 free minutes.

name: addendum

on:
  schedule:
    - cron: '30 2 * * 6'
  workflow_dispatch:

concurrency:
  group: publish   # shared with daily.yml and publish.yml, so two scorers never share Groq quota
  cancel-in-progress: false

jobs:
  addendum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - run: pip install -r requirements.txt

      # Process any Friday afternoon items. Triage first and unlimited (see publish.yml).
      - name: Triage items
        run: python -m agent.triage
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Extract articles
        run: python -m agent.extract --limit 100
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Generate embeddings
        run: python -m agent.embed --limit 100
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}

      - name: Score items
        run: python -m agent.score --limit 100
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}   # optional fallback
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}       # scoring-budget warning
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}

      - name: Send breaking alerts
        run: python -m agent.alerts
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}

      - name: Publish addendum
        run: python -m agent.addendum
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_VERSION: ${{ secrets.NOTION_VERSION }}
          NOTION_DS_WEEKS: ${{ secrets.NOTION_DS_WEEKS }}

      - name: Notify on failure
        if: failure()
        run: python -m agent.notify_failure
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
