# Retention: archive old Notion pages, keep memory.
#
# CRON IS UTC. IST = UTC+5:30.
# '30 21 * * *' = daily 21:30 UTC = daily 03:00 IST (next day)
#
# Budget: 30 runs/month x ~2 min = ~60 of 2,000 free minutes.

name: retention

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run retention
        run: python -m agent.retention
        env:
          NEON_DSN: ${{ secrets.NEON_DSN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_VERSION: ${{ secrets.NOTION_VERSION }}
          NOTION_DS_ITEMS: ${{ secrets.NOTION_DS_ITEMS }}
